<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dia de la Flor Morada</title>
<meta name="description" content="Un balcon de noche y unas palabras.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Pinyon+Script&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/escena.css">
</head>
<body>

<!-- ============ ESCENA: BALCON DE NOCHE ============ -->
<section id="terraza" class="escena">
  <svg class="escena__svg" viewBox="0 0 1200 760" preserveAspectRatio="xMidYMid slice" role="img"
       aria-label="El balcon de un piso de noche, con dos sillas, una mesita con un ramo de flores moradas y un hombre sentado de espaldas mirando la ciudad.">
    <defs>
      <linearGradient id="gCielo" gradientUnits="userSpaceOnUse" x1="0" y1="-900" x2="0" y2="470">
        <stop offset="0%"   stop-color="#03010a"/>
        <stop offset="52%"  stop-color="#05020e"/>
        <stop offset="66%"  stop-color="#0d0720"/>
        <stop offset="79%"  stop-color="#1d1038"/>
        <stop offset="90%"  stop-color="#331850"/>
        <stop offset="97%"  stop-color="#57296b"/>
        <stop offset="100%" stop-color="#7a3f70"/>
      </linearGradient>
      <radialGradient id="gLuna">
        <stop offset="0%"   stop-color="#fff8e6" stop-opacity=".50"/>
        <stop offset="40%"  stop-color="#e8c98a" stop-opacity=".16"/>
        <stop offset="100%" stop-color="#e8c98a" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="gHorizonte">
        <stop offset="0%"   stop-color="#b06ea8" stop-opacity=".42"/>
        <stop offset="100%" stop-color="#b06ea8" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="gAbajo" gradientUnits="userSpaceOnUse" x1="0" y1="470" x2="0" y2="1100">
        <stop offset="0%"   stop-color="#140c26"/>
        <stop offset="45%"  stop-color="#0e0821"/>
        <stop offset="100%" stop-color="#050310"/>
      </linearGradient>
      <linearGradient id="gSuelo" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"   stop-color="#241638"/>
        <stop offset="55%"  stop-color="#140b24"/>
        <stop offset="100%" stop-color="#08040f"/>
      </linearGradient>
      <linearGradient id="gMuro" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%"   stop-color="#0a0616"/>
        <stop offset="100%" stop-color="#1a1130"/>
      </linearGradient>
      <radialGradient id="gCharco">
        <stop offset="0%"   stop-color="#a97ad8" stop-opacity=".28"/>
        <stop offset="100%" stop-color="#a97ad8" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="gHaloFlor">
        <stop offset="0%"   stop-color="#c79cf0" stop-opacity=".30"/>
        <stop offset="100%" stop-color="#c79cf0" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="gSombraSuelo" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"   stop-color="#000" stop-opacity=".55"/>
        <stop offset="100%" stop-color="#000" stop-opacity="0"/>
      </linearGradient>
      <radialGradient id="gBrasa">
        <stop offset="0%"   stop-color="#ff8a3d" stop-opacity=".45"/>
        <stop offset="100%" stop-color="#ff8a3d" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="gLuzSilla">
        <stop offset="0%"   stop-color="#ffcf7a" stop-opacity=".13"/>
        <stop offset="60%"  stop-color="#ffcf7a" stop-opacity=".04"/>
        <stop offset="100%" stop-color="#f2d79b" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="gPantalla">
        <stop offset="0%"   stop-color="#cfd9ff" stop-opacity=".45"/>
        <stop offset="100%" stop-color="#cfd9ff" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="gHaloAmarillo">
        <stop offset="0%"   stop-color="#ffd966" stop-opacity=".45"/>
        <stop offset="100%" stop-color="#ffd966" stop-opacity="0"/>
      </radialGradient>
      <!-- cola de las estrellas fugaces: transparente atras, blanca en la cabeza -->
      <linearGradient id="gFugaz" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%"   stop-color="#f4ecfd" stop-opacity="0"/>
        <stop offset="70%"  stop-color="#e9dcff" stop-opacity=".45"/>
        <stop offset="100%" stop-color="#ffffff" stop-opacity=".95"/>
      </linearGradient>
      <!-- Guiños a Crepusculo -->
      <radialGradient id="gNiebla">
        <stop offset="0%"   stop-color="#b3a6d6" stop-opacity=".5"/>
        <stop offset="60%"  stop-color="#9d8fc4" stop-opacity=".18"/>
        <stop offset="100%" stop-color="#9d8fc4" stop-opacity="0"/>
      </radialGradient>
      <!-- tulipan de Luna Nueva: rojo en la base, blanco en las puntas -->
      <linearGradient id="gTulipan" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0%"   stop-color="#8c0f2a"/>
        <stop offset="55%"  stop-color="#c3263e"/>
        <stop offset="85%"  stop-color="#efd6da"/>
        <stop offset="100%" stop-color="#fff6f4"/>
      </linearGradient>
      <radialGradient id="gManzana">
        <stop offset="0%"   stop-color="#ff5a6e" stop-opacity=".5"/>
        <stop offset="100%" stop-color="#ff5a6e" stop-opacity="0"/>
      </radialGradient>
      <clipPath id="cSuelo">
        <path d="M256 580 L944 580 L1080 1400 L120 1400 Z"/>
      </clipPath>
      <filter id="fBrillo" x="-80%" y="-80%" width="260%" height="260%">
        <feGaussianBlur stdDeviation="5" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="fNiebla" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="16"/>
      </filter>
      <filter id="fSuave" x="-40%" y="-40%" width="180%" height="180%">
        <feGaussianBlur stdDeviation="2.2"/>
      </filter>
    </defs>

    <!-- ========================================================
         1. CIELO
         ======================================================== -->
    <rect x="-700" y="-900" width="2600" height="1370" fill="url(#gCielo)"/>
    <g id="estrellas"></g>

    <!-- Luna -->
    <circle cx="862" cy="94" r="230" fill="url(#gLuna)"/>
    <circle cx="862" cy="94" r="54" fill="#fdf6e4" opacity=".94"/>
    <circle cx="843" cy="80" r="10" fill="#e3d3b4" opacity=".45"/>
    <circle cx="877" cy="111" r="13"   fill="#e3d3b4" opacity=".32"/>
    <circle cx="852" cy="118" r="7" fill="#e3d3b4" opacity=".38"/>

    <!-- Nubes finas -->
    <g opacity=".20" filter="url(#fNiebla)">
      <ellipse cx="300" cy="54" rx="190" ry="13" fill="#c08ada"/>
      <ellipse cx="760" cy="296" rx="200" ry="10" fill="#c08ada"/>
      <ellipse cx="420" cy="-46" rx="160" ry="9" fill="#c08ada"/>
    </g>

    <!-- Estrellas fugaces (las lanza escena.js) -->
    <g id="fugaces"></g>

    <!-- Resplandor de la ciudad sobre el horizonte -->
    <ellipse cx="600" cy="452" rx="1300" ry="96" fill="url(#gHorizonte)"/>

    <!-- ========================================================
         2. LA CIUDAD
         ======================================================== -->
    <!-- Montanas lejanas -->
    <path d="M-700 392 L-400 330 L-180 388 L110 322 L200 376 L316 292 L414 372 L506 338 L600 392 L1200 392 L1900 392 L1900 456 L-700 456 Z"
          fill="#3b2a5e" opacity=".42"/>

    <!-- Bosque de pinos, como en Forks (escena.js) -->
    <g id="pinosLejos"></g>
    <g id="ciudadLejos"></g>
    <ellipse cx="600" cy="442" rx="1100" ry="18" fill="#8d79bd" opacity=".16" filter="url(#fNiebla)"/>
    <g id="pinosCerca"></g>
    <g id="ciudadMedia"></g>
    <!-- Niebla que cruza despacio la ciudad (escena.js) -->
    <g id="nieblaLejos"></g>

    <!-- La ciudad que sigue por debajo del balcon -->
    <rect x="-700" y="466" width="2600" height="740" fill="url(#gAbajo)"/>
    <g id="ciudadCerca"></g>
    <g id="nieblaCerca"></g>
    <g id="farolas"></g>

    <!-- Nieve lejana, cayendo sobre la ciudad (escena.js) -->
    <g id="nieveLejos"></g>

    <!-- ========================================================
         3. EL BALCON
         ======================================================== -->
    <!-- Suelo -->
    <path d="M256 580 L944 580 L1080 1400 L120 1400 Z" fill="url(#gSuelo)"/>
    <g clip-path="url(#cSuelo)" stroke="#d9c2f2" stroke-opacity=".05" stroke-width="1">
      <line x1="600" y1="470" x2="60"   y2="1200"/>
      <line x1="600" y1="470" x2="330"  y2="1200"/>
      <line x1="600" y1="470" x2="600"  y2="1200"/>
      <line x1="600" y1="470" x2="870"  y2="1200"/>
      <line x1="600" y1="470" x2="1140" y2="1200"/>
      <line x1="150" y1="648" x2="1050" y2="648"/>
      <line x1="130" y1="726" x2="1070" y2="726"/>
      <line x1="105" y1="820" x2="1095" y2="820"/>
    </g>

    <!-- Barandilla, solo el ancho del balcon -->
    <g fill="#0c0617">
      <rect x="256" y="486" width="688" height="11" rx="5"/>
      <g id="balaustres"></g>
      <rect x="256" y="572" width="688" height="9" rx="4"/>
    </g>
    <rect x="256" y="486" width="688" height="2" rx="1" fill="#d9c2f2" opacity=".14"/>

    <!-- Muros laterales: el balcon es estrecho -->
    <g>
      <path d="M256 586 L256 392 L150 324 L150 1400 Z" fill="#150d28"/>
      <path d="M256 586 L256 392 L150 324 L150 1400 Z" fill="url(#gMuro)" opacity=".55"/>
      <path d="M256 392 L150 324" stroke="#d9c2f2" stroke-opacity=".22" stroke-width="3.5" fill="none"/>
      
      <path d="M246 586 L246 400" stroke="#d9c2f2" stroke-opacity=".07" stroke-width="2" fill="none"/>

      <path d="M944 586 L944 392 L1050 324 L1050 1400 Z" fill="#150d28"/>
      <path d="M944 586 L944 392 L1050 324 L1050 1400 Z" fill="url(#gMuro)" opacity=".38"/>
      <path d="M944 392 L1050 324" stroke="#d9c2f2" stroke-opacity=".26" stroke-width="3.5" fill="none"/>
      
      <path d="M954 586 L954 400" stroke="#d9c2f2" stroke-opacity=".09" stroke-width="2" fill="none"/>
    </g>

    <!-- Calendario colgado en el muro, con el 9 de noviembre marcado.
         Con el mensaje del tiempo pasan las hojas, como en Luna Nueva (escena.js) -->
    <g transform="translate(219 418) skewY(5) scale(.72 1)">
      <line x1="22" y1="-8" x2="22" y2="0" stroke="#6d5a8c" stroke-width="1"/>
      <circle cx="22" cy="-8" r="1.4" fill="#8a76ad"/>
      <g id="hojaCalendario">
        <rect x="0" y="0" width="44" height="50" rx="1.5" fill="#bdb3d4" opacity=".78"/>
        <rect x="0" y="0" width="44" height="11" rx="1.5" fill="#5b2d91" opacity=".9"/>
        <text id="mesCalendario" x="22" y="8.4" text-anchor="middle" font-family="Georgia,serif" font-size="7.5"
              letter-spacing="1" fill="#f3e9ff">NOV</text>
        <g id="diasCalendario" fill="#6d6285"></g>
        <circle class="dia-marcado" cx="0" cy="0" r="3.4" fill="none" stroke="#8b3fd9" stroke-width="1.3"/>
      </g>
    </g>

    <!-- Postes de la barandilla contra los muros -->
    <g fill="#0c0617">
      <rect x="252" y="478" width="18" height="108" rx="5"/>
      <rect x="930" y="478" width="18" height="108" rx="5"/>
    </g>

    <!-- Nieve acumulada: barandilla, postes, muros y el pie de la barandilla -->
    <g id="nieveAcumulada" fill="#eef0fb">
      <path d="M256 489 L256 486 Q 300 479, 340 483 T 430 482 T 520 484 T 610 481 T 700 484
               T 790 482 T 880 483 T 944 485 L 944 489 Z" opacity=".82"/>
      <path d="M256 575 L256 573 Q 320 568, 390 571 T 530 570 T 670 571 T 810 569 T 944 572 L 944 575 Z" opacity=".55"/>
      <ellipse cx="261" cy="478" rx="11" ry="3.5" opacity=".85"/>
      <ellipse cx="939" cy="478" rx="11" ry="3.5" opacity=".85"/>
      <path d="M256 392 L150 324 L150 317 Q 204 344, 256 385 Z" opacity=".7"/>
      <path d="M944 392 L1050 324 L1050 317 Q 996 344, 944 385 Z" opacity=".75"/>
      <path d="M270 590 Q 430 580, 600 586 T 930 588 L 930 593 Q 600 589, 270 594 Z" opacity=".22"/>
      <!-- brillo frio en el borde de la nieve -->
      <path d="M258 484 Q 300 478, 340 482 T 430 481 T 520 483 T 610 480 T 700 483 T 790 481 T 880 482 T 942 484"
            fill="none" stroke="#ffffff" stroke-opacity=".5" stroke-width="1"/>
    </g>

    <!-- Manzana roja sobre la nieve de la barandilla (Crepusculo).
         Brilla al pasar por encima o al tocarla -->
    <g id="manzana" class="manzana" transform="translate(195 -142)">
      <circle class="manzana__brillo" id="brilloManzana" cx="683" cy="621" r="18" fill="url(#gManzana)"/>
      <ellipse cx="684" cy="627.5" rx="7" ry="1.6" fill="#000" opacity=".3" filter="url(#fSuave)"/>
      <path d="M683 616.5 C 680 614.5, 676.5 616, 676.5 620.5 C 676.5 625, 679.5 628, 682 627.5
               C 682.6 627.4, 683.4 627.4, 684 627.5 C 686.5 628, 689.5 625, 689.5 620.5
               C 689.5 616, 686 614.5, 683 616.5 Z" fill="#9e1b2c"/>
      <path d="M686 616 C 688.6 616.4, 689.5 618.6, 689.5 620.5 C 689.5 625, 686.5 628, 684 627.5
               C 686.4 625.6, 687.4 621, 686 616 Z" fill="#6a0f1e" opacity=".8"/>
      <ellipse cx="679.8" cy="619.4" rx="1.4" ry="2.2" fill="#ffe3e6" opacity=".38" transform="rotate(20 679.8 619.4)"/>
      <path d="M683 616.5 C 683 614.4, 683.6 613, 684.6 612" fill="none" stroke="#3a2410" stroke-width="1" stroke-linecap="round"/>
      <path d="M684.4 613.2 C 686.4 611.4, 688.6 611.6, 689.4 612.4 C 687.6 613.8, 685.6 614, 684.4 613.2 Z" fill="#38684a"/>
      <!-- zona para tocarla, algo mas grande que la manzana -->
      <circle cx="683" cy="621" r="13" fill="transparent"/>
    </g>

    <!-- Luz calida sobre el suelo -->
    <ellipse cx="600" cy="712" rx="330" ry="54" fill="url(#gCharco)"/>

    <!-- Guirnalda de luces, de muro a muro -->
    <path id="guirnalda" d="M 164 334 Q 600 398 1036 334" fill="none"
          stroke="#d9c2f2" stroke-opacity=".22" stroke-width="1.6"/>
    <g id="bombillas"></g>

    <!-- Sombras en el suelo -->
    <g fill="url(#gSombraSuelo)">
      <ellipse cx="398" cy="744" rx="118" ry="20"/>
      <ellipse cx="802" cy="744" rx="118" ry="20"/>
      <ellipse cx="600" cy="732" rx="86"  ry="16"/>
    </g>

    <!-- El prado: flores moradas que brotan en el suelo al final (escena.js).
         Las del fondo van aqui, detras de los muebles; las de delante, tras el gato -->
    <g id="prado"></g>

    <!-- Tulipan rojo y blanco en una botella, en la esquina junto al muro (Luna Nueva).
         Pierde un petalo con el mensaje de "no te presionare" (escena.js -> MOMENTOS) -->
    <g>
      <ellipse cx="293" cy="648" rx="14" ry="3" fill="#000" opacity=".45" filter="url(#fSuave)"/>
      <!-- botella de cristal -->
      <path d="M284 647 L284 628 C 284 623, 289 621, 290 617 L290 610 L296 610 L296 617
               C 297 621, 302 623, 302 628 L302 647 C 302 649, 284 649, 284 647 Z"
            fill="#6f5f9e" fill-opacity=".28" stroke="#d9c2f2" stroke-opacity=".35" stroke-width=".8"/>
      <path d="M285 640 L301 640 L301 647 C 301 648.6, 285 648.6, 285 647 Z" fill="#9ec4e8" opacity=".18"/>
      <path d="M287 627 L287 644" stroke="#ffffff" stroke-opacity=".3" stroke-width="1.2" stroke-linecap="round"/>
      <!-- tallo y hoja -->
      <path d="M293 645 C 293 630, 292 600, 290 572" stroke="#38684a" stroke-width="2.4"
            stroke-linecap="round" fill="none" opacity=".85"/>
      <path d="M292 604 C 282 596, 279 584, 282 574 C 290 582, 293 594, 292 604 Z" fill="#38684a" opacity=".7"/>
      <g transform="translate(290 570)">
        <path d="M-8 2 C -9 -8, -5 -16, 0 -19 C 5 -16, 9 -8, 8 2 Z" fill="url(#gTulipan)" opacity=".85"/>
        <path d="M-9.5 3 C -11.5 -6, -8.5 -14.5, -3 -18 C -1 -10.5, -1 -2, 0 5.5 C -4 6.5, -7.5 5.5, -9.5 3 Z"
              fill="url(#gTulipan)"/>
        <path id="petaloTulipan" d="M9.5 3 C 11.5 -6, 8.5 -14.5, 3 -18 C 1 -10.5, 1 -2, 0 5.5 C 4 6.5, 7.5 5.5, 9.5 3 Z"
              fill="url(#gTulipan)"/>
        <path d="M-6 -6 C -6 -10, -4.6 -13.4, -3 -15.6" fill="none" stroke="#ffffff" stroke-opacity=".35" stroke-width="1"/>
      </g>
    </g>

    <!-- ========================================================
         4. SILLA DERECHA (vacia, con una manta doblada)
         ======================================================== -->
    <g>
      <g fill="#0c071c">
        <rect x="764" y="688" width="8" height="44" rx="4"/>
        <rect x="832" y="688" width="8" height="44" rx="4"/>
      </g>
      <g fill="#100926">
        <rect x="752" y="618" width="100" height="62" rx="14"/>
        <rect x="746" y="612" width="112" height="14" rx="7"/>
      </g>
      <g fill="#1a1130">
        <rect x="770" y="634" width="7" height="40" rx="3.5"/>
        <rect x="798" y="634" width="7" height="40" rx="3.5"/>
        <rect x="826" y="634" width="7" height="40" rx="3.5"/>
      </g>
      <g fill="#100926">
        <rect x="737" y="678" width="130" height="17" rx="8"/>
        <rect x="742" y="692" width="11" height="58" rx="5"/>
        <rect x="856" y="692" width="11" height="58" rx="5"/>
      </g>
      <rect x="746" y="612" width="112" height="2.5" rx="1.2" fill="#d9c2f2" opacity=".12"/>

      <!-- la manta, doblada sobre el respaldo -->
      <g>
        <path d="M772 608 C 792 602, 822 602, 842 608
                 L 845 664 C 842 674, 828 679, 810 679
                 C 792 679, 778 674, 770 666 Z" fill="#2c1e48"/>
        <path d="M772 608 C 792 602, 822 602, 842 608
                 L 841 624 C 820 617, 793 617, 773 624 Z" fill="#3b2a60"/>
        <path d="M773 612 C 793 606, 821 606, 841 612" fill="none"
              stroke="#c0a4e4" stroke-opacity=".22" stroke-width="2"/>
        <g stroke="#3b2a60" stroke-width="2" stroke-linecap="round" opacity=".8">
          <path d="M776 670 L775 680"/>
          <path d="M788 676 L787 687"/>
          <path d="M800 678 L800 690"/>
          <path d="M812 679 L813 691"/>
          <path d="M824 677 L826 689"/>
          <path d="M836 672 L839 683"/>
        </g>
        <path d="M790 630 C 804 626, 818 626, 830 630" fill="none"
              stroke="#1d123a" stroke-width="2" opacity=".7"/>
      </g>
    </g>

    <!-- Ajedrez a medias sobre la silla vacia (Amanecer): la reina roja y un peon
         blanco, esperando a que alguien mueva -->
    <g>
      <ellipse cx="781" cy="681" rx="36" ry="3" fill="#000" opacity=".35" filter="url(#fSuave)"/>
      <!-- grosor del tablero -->
      <path d="M750 678 L812 678 L812 681 L750 681 Z" fill="#1a1024"/>
      <path d="M756 671 L806 671 L812 678 L750 678 Z" fill="#3a2a2e"/>
      <g id="tablero"></g>
      <path d="M756 671 L806 671 L812 678 L750 678 Z" fill="none" stroke="#d9c2f2" stroke-opacity=".18" stroke-width=".6"/>
      <!-- peon blanco, al fondo -->
      <g transform="translate(796 673.5) scale(.85)">
        <ellipse cx="0" cy="0" rx="3.6" ry="1.2" fill="#cfc6c4"/>
        <path d="M-2.6 -.4 C -2 -3, -1.2 -5, -1.2 -6 L1.2 -6 C 1.2 -5, 2 -3, 2.6 -.4 Z" fill="#e9e1dc"/>
        <ellipse cx="0" cy="-6.2" rx="2" ry=".7" fill="#d8cfca"/>
        <circle cx="0" cy="-8.2" r="2.2" fill="#f2ece6"/>
        <path d="M1 -9.6 C 1.8 -9, 2.1 -8, 1.9 -7.2 M1.3 -5.8 C 1.6 -4, 2 -2, 2.3 -.6" fill="none"
              stroke="#ffffff" stroke-opacity=".6" stroke-width=".5"/>
      </g>
      <!-- reina roja, delante -->
      <g transform="translate(770 676.5)">
        <ellipse cx="0" cy="0" rx="4.8" ry="1.5" fill="#6e0f22"/>
        <path d="M-4.6 -.2 L4.6 -.2 L3.8 -2.2 L-3.8 -2.2 Z" fill="#8c1428"/>
        <path d="M-3 -2.2 C -2.4 -6, -1.5 -9, -1.7 -11 L1.7 -11 C 1.5 -9, 2.4 -6, 3 -2.2 Z" fill="#a3182f"/>
        <ellipse cx="0" cy="-11" rx="3" ry="1" fill="#8c1428"/>
        <path d="M-2.8 -11.6 L-3.5 -15 L-1.7 -13.2 L0 -16 L1.7 -13.2 L3.5 -15 L2.8 -11.6 Z" fill="#b51d36"/>
        <circle cx="0" cy="-16.8" r="1" fill="#c9304a"/>
        <path d="M1.4 -3 C 1.1 -6, .9 -8.6, 1 -10.4 M2.2 -12 L3 -14.4" fill="none"
              stroke="#ffb3be" stroke-opacity=".45" stroke-width=".6" stroke-linecap="round"/>
      </g>
    </g>

    <!-- Luz sobre la silla vacia, como si esperara a alguien (mensaje "ser la luz") -->
    <g class="luz-silla">
      <ellipse cx="802" cy="742" rx="140" ry="26" fill="url(#gLuzSilla)"/>
      <ellipse cx="802" cy="652" rx="100" ry="92" fill="url(#gLuzSilla)"/>

        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6.5-6.2-6.5-11a6.5 6.5 0 0 1 13 0c0 4.8-6.5 11-6.5 11z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><circle cx="12" cy="10" r="2.3" fill="currentColor"/></svg>
        <span class="mensajes__etiqueta"></span>
      </a>
      <button type="button" class="mensajes__repetir mensajes__repetir--discreto" id="repetir" tabindex="-1">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12a7 7 0 1 0 2.1-5M5 4v4h4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Volver a empezar</span>
      </button>
    </div>
  </div>

  <!-- ---------- LA CARTA (el texto se escribe en escena.js -> CARTA) ---------- -->
  <div class="carta" id="carta" role="dialog" aria-modal="true" aria-labelledby="cartaTitulo" hidden>
    <article class="carta__papel" id="cartaPapel" tabindex="-1">
      <button type="button" class="carta__cerrar" id="cartaCerrar" aria-label="Cerrar la carta">&times;</button>

      <!-- sello de lacre con una flor -->
      <svg class="carta__sello" viewBox="0 0 64 64" aria-hidden="true">
        <defs>
          <radialGradient id="gLacre" cx="40%" cy="35%">
            <stop offset="0%" stop-color="#c9304a"/>
            <stop offset="60%" stop-color="#8c1428"/>
            <stop offset="100%" stop-color="#5a0a19"/>
          </radialGradient>
        </defs>
        <path d="M32 3 C 40 2, 46 6, 52 9 C 58 14, 62 22, 61 31 C 62 40, 58 49, 51 55
                 C 45 60, 38 62, 31 61 C 22 62, 14 58, 9 51 C 4 45, 2 38, 3 30
                 C 3 21, 7 13, 14 8 C 19 4, 26 3, 32 3 Z" fill="url(#gLacre)"/>
        <circle cx="32" cy="32" r="19" fill="none" stroke="#5a0a19" stroke-width="1.4" opacity=".7"/>
        <circle cx="32" cy="32" r="17.5" fill="none" stroke="#e0586c" stroke-width=".6" opacity=".35"/>
        <g fill="#6e0f22" stroke="#e0586c" stroke-opacity=".3" stroke-width=".6">
          <ellipse cx="32" cy="24" rx="4.2" ry="6"/>
          <ellipse cx="32" cy="24" rx="4.2" ry="6" transform="rotate(72 32 32)"/>
          <ellipse cx="32" cy="24" rx="4.2" ry="6" transform="rotate(144 32 32)"/>
          <ellipse cx="32" cy="24" rx="4.2" ry="6" transform="rotate(216 32 32)"/>
          <ellipse cx="32" cy="24" rx="4.2" ry="6" transform="rotate(288 32 32)"/>
        </g>
        <circle cx="32" cy="32" r="3" fill="#a3182f"/>
        <ellipse cx="23" cy="17" rx="6" ry="3" fill="#ffffff" opacity=".14" transform="rotate(-30 23 17)"/>
      </svg>

      <p class="carta__epigrafe" id="cartaEpigrafe"></p>
      <h2 class="carta__titulo" id="cartaTitulo"></h2>
      <div class="carta__cuerpo" id="cartaCuerpo"></div>

      <footer class="carta__pie">
        <!-- flor morada prensada entre las hojas -->
        <svg class="carta__flor" viewBox="0 0 80 110" aria-hidden="true">
          <path d="M40 44 C 42 64, 36 84, 30 106" fill="none" stroke="#5f7a52" stroke-width="2" stroke-linecap="round" opacity=".7"/>
          <path d="M38 74 C 26 66, 18 68, 14 76 C 24 80, 32 80, 38 74 Z" fill="#6f8a5e" opacity=".55"/>
          <path d="M36 88 C 46 82, 54 84, 58 90 C 50 95, 42 94, 36 88 Z" fill="#6f8a5e" opacity=".5"/>
          <g fill="#8b52c9" opacity=".72">
            <ellipse cx="40" cy="28" rx="8" ry="11"/>
            <ellipse cx="40" cy="28" rx="8" ry="11" transform="rotate(72 40 40)"/>
            <ellipse cx="40" cy="28" rx="8" ry="11" transform="rotate(144 40 40)"/>
            <ellipse cx="40" cy="28" rx="8" ry="11" transform="rotate(216 40 40)"/>
            <ellipse cx="40" cy="28" rx="8" ry="11" transform="rotate(288 40 40)"/>
          </g>
          <g fill="none" stroke="#5b2d91" stroke-opacity=".35" stroke-width=".7">
            <path d="M40 38 L40 22"/><path d="M42 39 L54 33"/><path d="M41 42 L48 53"/>
            <path d="M39 42 L32 53"/><path d="M38 39 L26 33"/>
          </g>
          <circle cx="40" cy="40" r="4" fill="#d8b86a" opacity=".85"/>
        </svg>
        <p class="carta__firma" id="cartaFirma"></p>
      </footer>
    </article>
  </div>

  <!-- notificacion del movil (el texto esta en escena.js -> MOMENTOS) -->
  <div class="aviso" id="aviso" aria-hidden="true">
    <span class="aviso__app">Recordatorio</span>
    <span class="aviso__texto" id="avisoTexto"></span>
  </div>

  <!-- ---------- PORTADA: el navegador solo deja sonar musica tras un toque ---------- -->
  <div class="inicio" id="inicio" role="button" tabindex="0" aria-label="Empezar">
    <p class="inicio__titulo">Día de la Flor Morada</p>
    <p class="inicio__pista">toca para empezar</p>
  </div>

  <!-- ---------- MUSICA ---------- -->
  <!-- Pon tu cancion en assets/audio/musica.mp3 (o cambia la ruta aqui) -->
  <audio id="musica" src="assets/audio/musica.mp3" loop preload="auto"></audio>
  <button type="button" class="sonido" id="sonido" aria-label="Silenciar musica" aria-pressed="false" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M9 18V6l10-2v12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="6.5" cy="18" r="2.5" fill="currentColor"/>
      <circle cx="16.5" cy="16" r="2.5" fill="currentColor"/>
      <path class="sonido__tachado" d="M4 4l16 16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
  </button>
</section>

<script src="assets/js/escena.js"></script>
</body>
</html>
